name: RetroTrace Taiwan Daily Check
on:
  schedule:
    # 台灣時間週一至週五 07:30 執行 (UTC 週日 ~ 週四 23:30)
    - cron: '30 23 * * 0-4'
  workflow_dispatch: # 允許你手動點擊按鈕執行測試
    inputs:
      self_only_manual:
        description: '手動觸發時是否只寄給自己，不走回檔門檻判斷'
        required: true
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 複製程式碼
        uses: actions/checkout@v4
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝必要套件
        run: |
          pip install -r requirements.txt
      - name: 執行回檔監控
        env:
          # 從 GitHub Secrets 讀取變數
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          SECOND_RECEIVER: ${{ secrets.SECOND_RECEIVER }}
          TRIGGER_EVENT: ${{ github.event_name }}
          SELF_ONLY_MANUAL: ${{ github.event.inputs.self_only_manual }}
        run: python retro_trace_github.py
